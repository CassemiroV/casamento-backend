spring.application.name=casamento
spring.datasource.url=${DB_SUPABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
mercadopago.access.token=${MERCADO_PAGO_ACCESS_TOKEN}

ds.cf.turnstile.sitekey=${CLOUDFLARE_TURNSTILE_SITE_KEY}
ds.cf.turnstile.secret=${CLOUDFLARE_TURNSTILE_SECRET_KEY}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true